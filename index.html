<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solaris · Mission Clock</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <main class="widget" aria-label="Solaris Mission Clock">
    <section class="mission-card">
      <header class="widget-header">
        <div class="brand-mark" aria-hidden="true"></div>

        <div class="title-block">
          <span class="eyebrow">SOLARIS</span>
          <h1>MISSION CLOCK</h1>
        </div>

        <div class="status-pill">
          <span class="status-light"></span>
          LIVE
        </div>
      </header>

      <section class="progress-list">
        <article class="progress-row progress-row-main">
          <div class="row-top">
            <span id="label-season" class="label">TEMPORADA 2025/26</span>
            <span id="value-season" class="value">--%</span>
          </div>
          <div class="track track-main">
            <div id="bar-season" class="fill"></div>
          </div>
        </article>

        <article class="progress-row">
          <div class="row-top">
            <span id="label-month" class="label">MES</span>
            <span id="value-month" class="value">--%</span>
          </div>
          <div class="track">
            <div id="bar-month" class="fill"></div>
          </div>
        </article>

        <article class="progress-row">
          <div class="row-top">
            <span id="label-week" class="label">SEMANA</span>
            <span id="value-week" class="value">--%</span>
          </div>
          <div class="track">
            <div id="bar-week" class="fill"></div>
          </div>
        </article>

        <article class="progress-row">
          <div class="row-top">
            <span id="label-day" class="label">DÍA</span>
            <span id="value-day" class="value">--%</span>
          </div>
          <div class="track">
            <div id="bar-day" class="fill"></div>
          </div>
        </article>
      </section>

      <footer class="widget-footer">
        <span id="local-time">--:--:--</span>
        <span class="footer-dot"></span>
        <span id="season-window">ES PENINSULAR</span>
      </footer>
    </section>
  </main>
</body>
</html>
